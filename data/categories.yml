# SINGLE SOURCE OF TRUTH for the category taxonomy.
#
# This file generates:
#   - the `category` enum in schema/program.schema.json
#   - the category dropdown in .github/ISSUE_TEMPLATE/add-program.yml
#   - the README table of contents and section order
#   - the generated pages under categories/
#
# Never hand-edit any of those. Run `make build`.
#
# `estimated_available` and `verification_difficulty` come from the research
# sweep documented in docs/methodology.md. They are planning aids for
# maintainers, not claims about the dataset, and are not rendered publicly.

