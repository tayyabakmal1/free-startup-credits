# yaml-language-server: $schema=https://raw.githubusercontent.com/tayyabakmal1/free-startup-credits/main/schema/program.schema.json

slug: neon-databricks-startup-program
company: Neon (Databricks)
program: Neon and Databricks Startup Program
category: databases
tags: [postgres, serverless, databricks, tiered]

# Links. official_source is the exact page carrying evidence_quote.
homepage: "https://neon.com"
apply_url: "https://neon.com/startups"
official_source: "https://neon.com/startups"

# Benefit
benefit_type: credit
benefit_summary: >-
  Two tiers of credits valid 12 months: up to $1,000 in Neon credits for
  self-funded startups with under $1M raised, and up to $200K in Neon and
  Databricks credits for VC-backed startups with at least $1M raised or
  recognized-accelerator participants.
amount_is_published: true
amount_max: 200000
currency: USD
duration_months: 12
expiry_note: Credits are valid for 12 months from the date of acceptance.
after_credits: >-
  Page states: "When your credits are used up or reach their 12-month
  expiration, your account continues on your selected plan and you're
  billed normally for usage beyond the credit."
tiers:
  - name: Self-funded
    amount_max: 1000
    funding_max_usd: 1000000
    partner_gate: none
    quote: Up to $1,000 in Neon credits
    notes: >-
      Eligibility quoted as "Less than $1M in funding" and "Building an
      early-stage product or MVP".
  - name: Venture-backed
    amount_max: 200000
    funding_min_usd: 1000000
    partner_gate: improves-offer
    quote: Up to $200K in Neon and Databricks credits
    notes: >-
      Eligibility quoted as "VC-backed startups with at least $1M in funding"
      or "Participants in recognized accelerators (e.g. Y Combinator)". This is
      a funding FLOOR, not a cap.
accelerator_required: false
open_to_bootstrapped: true
requires_vc_backing: false
partner_gate: tiered
partners: [Y Combinator]
stages: [idea, pre-seed, seed, series-a]
new_customer_only: false

# Geography. See docs/verification-policy.md for what 'asserted' requires.
regions: []
excluded_regions: []
regions_basis: unstated
eligibility_notes: >-
  Two distinct tiers with opposite funding directions: the self-funded tier
  requires "Less than $1M in funding" (a ceiling), the venture-backed tier
  requires "at least $1M in funding" (a floor) or participation in a
  recognized accelerator such as Y Combinator. Top-level funding fields are
  left null because the two tiers point in opposite directions; see
  tiers[]. The page states existing customers can apply and that approved
  applicants receive credits on their current account without migration, so
  new_customer_only is recorded as false. Independently re-audited: a
  second reviewer opened the vendor page and checked the quote, amount and
  source.

# Application
application_mechanism: self-serve-form
requires_sales_call: false
approval_time: typically responds within a few business days

# Status
status: active-self-serve
status_basis: asserted
status_quote: >-
  Apply using the link on this page. Our team reviews each application and
  typically responds within a few business days.
fetch_note: >-
  200 and rendered in full, including both tier descriptions, the 12-month
  validity statement and the post-credit billing FAQ answer.

# Provenance
last_verified: "2026-09-14"
verified_by: tayyabakmal1
verification_level: verified
evidence_quote: Up to $200K in Neon and Databricks credits
bot_blocked: false
