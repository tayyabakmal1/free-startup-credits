eligibility_notes: 'NEGATIVE RESULT, INFERRED NOT ASSERTED. Snyk does not anywhere state that
  it has no startup program, so status_basis is "inferred". What I verified directly: (1)
  https://snyk.io/startups/ returned 200 and its full text contains no credit amount, no discount
  percentage, no term length, no eligibility criteria and no application form — only "Book
  a live demo" and "Start free" CTAs and three customer testimonials; (2) https://snyk.io/plans/
  returned 200 and contains zero occurrences of the word "startup"; (3) https://snyk.io/startup-program
  and https://snyk.io/startups/program both return 404. Third-party listings claiming a "Startup-tier
  discount" for pre-seed/seed/Series A with no VC referral required could not be traced to
  any Snyk-owned page and are NOT recorded. A founder wanting startup pricing would have to
  contact Snyk sales; that is an inference, not a published route. Re-confirmed 2026-09-16:
  the quote appears verbatim, and the page publishes no startup-specific discount, credit
  or eligibility rule - only ''Book a live demo'' and ''Start free'' calls to action.'
