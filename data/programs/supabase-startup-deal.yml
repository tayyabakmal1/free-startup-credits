  no credits program, no amounts, and no application.
  https://supabase.com/docs/guides/platform/credits documents only
  self-serve credit top-ups (max $2000 per top-up), not a startup program.
  https://supabase.com/startups and https://supabase.com/startup-program
  both return 404. Third-party figures circulating for this program are not
  traceable to any Supabase page and were deliberately not recorded.

