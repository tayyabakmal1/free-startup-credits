eligibility_notes: >-
  Could not inspect: benefit amount, duration, eligibility, and application
  terms. The form page at forms.supabase.com/supabasedeal is a
  JavaScript-only shell — the only server-rendered text is the heading
  "Supabase Startup Deal Application Form".
