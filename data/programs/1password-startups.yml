eligibility_notes: 'What could not be inspected: 1Password does not publish any page that
  affirmatively denies having a startup program, so absence is established indirectly rather
  than by an explicit statement. Evidence gathered: https://1password.com/startups, /for-startups
  and /business/startups all return 404; the business pricing FAQ enumerates its discount
