  Seed - these are form constraints rather than stated rules, so
  employees_max is left null. The Country dropdown enumerates ~35 countries
  but also offers "Other", so it is not a stated geographic restriction.
  The approved-partner list lives at
  https://www.framer.com/startups/vc-partners/ (200). Independently
  re-audited: a second reviewer opened the vendor page and checked the
  quote, amount and source.

