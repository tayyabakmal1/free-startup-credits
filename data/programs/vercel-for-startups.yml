eligibility_notes: >-
  The page publishes NO eligibility criteria at all — no funding stage,
  company age, headcount, revenue, incorporation or geography test, and no
  FAQ. The only qualifier is the phrase "eligible teams". The application
  is an on-page interest form ("Interested in joining Vercel for Startups?
  We'd love to hear from you if you're interested in participating in
  Vercel's startup program.") collecting name, work email, company size,
  website and country, submitted via a "Submit interest" button; the page
  does not state what happens next or whether a sales call is required. The
  form's country dropdown lists most countries but is a form field, not a
  published availability statement, so no region claim is recorded.
  Independently re-audited: a second reviewer opened the vendor page and
  checked the quote, amount and source.

