eligibility_notes: 'IMPORTANT DISTINCTION: this is not a discount on Clerky. Clerky''s own
  pricing page (https://www.clerky.com/pricing, fetched 200) publishes a $819 Company Lifetime
  Package and $427 pay-per-use incorporation with NO startup discount, free plan or credits
  of its own. The Perks catalogue is third-party offers redeemed from the Clerky dashboard,
  and Clerky disclaims control over them: "The companies below all have their own eligibility
  requirements, which we unfortunately don''t have any control over." What I could NOT inspect:
  the per-perk terms and their individual eligibility rules live behind each partner, and
  the dashboard itself is account-gated, so the live perk list and amounts could not be confirmed
  beyond the banking examples named in the help article. No Clerky-side eligibility rule (age,
  funding, region) is published. Imported from a verification sweep whose quote fidelity later
  failed audit in 13 of 22 sampled records. This entry was NOT independently re-audited, so
  the evidence quote may be a close paraphrase rather than the vendor''s exact wording. Re-read
  the source before relying on precise phrasing. Re-confirmed 2026-09-16. This is a third-party
  perks catalogue, not a Clerky discount - listed offers include "$5000 in AWS credits, valid
  for 2 years" and "6 months free" (Xero). Clerky states plainly that eligibility for each
  is set by the third party, so no single amount or rule can be attributed to Clerky.'
