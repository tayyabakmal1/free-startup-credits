# Geography. See docs/verification-policy.md for what 'asserted' requires.
regions: []
excluded_regions: []
regions_basis: unstated
eligibility_notes: >-
  Published acceptance criteria verbatim: "You have a small or big team and
  you're not using Coda on your own"; "Be a business less than 5 years
  old"; "Have raised less than $10M USD" (a CEILING, with no floor stated,
  so funding_required stays unknown); "Your Coda account is using a
  business domain and not a personal email (gmail.com, hotmail.com, etc)";
  "You can provide a company website"; "You don't currently have a paid
  subscription and have not paid for Coda in the last 30 days."
  new_customer_only is recorded as false because that last criterion
  explicitly admits former paying customers after a 30-day gap rather than
  requiring a brand-new account. Partner route: "Free unlimited Coda AI if
  you apply through one of our partners" and "All partner-affiliated
  startups that meet our requirements will be approved (must include proof
  in application)" — a partner improves the offer and guarantees approval
  but is not required. NOTE: Coda has rebranded — the page banner reads
  "Coda is now Superhuman Docs" and the application form URL resolves to
  docs.superhuman.com; the historic $1,000 startup credit that aggregators
  still list does not appear anywhere on this page. AUDIT: the application
  form now redirects cross-domain to superhuman.com, following Coda's
  acquisition. A cross-brand redirect is the strongest discontinuation
  signal available without reading the page, so this is no longer treated
  as active pending a human re-check.

