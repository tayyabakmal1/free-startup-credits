    from any fund". So the partner-network route has no stated funding floor, while the any-fund
    route has a stated floor of $1m. Tier is described as "Free credits for rising startups";
    no figure published.'
- name: Scaling and Series B+
  quote: Raised VC funding > $30m or post-series B
  funding_min_usd: 30000000
  partner_gate: required-hard
  notes: A second stated condition for this tier is "VC is part of our partner network". Modal
    describes the tier as "Custom for rapidly growing AI-native companies" and publishes no
    credit figure.
