# Benefit
benefit_type: credit
benefit_summary: >-
  Up to $200K in credits split across Databricks and Neon, plus technical
  guidance and go-to-market access. Credit duration is not published.
amount_is_published: true
amount_max: 200000
currency: USD
partner_gate: none
stages: [pre-seed, seed, series-a]

# Geography. See docs/verification-policy.md for what 'asserted' requires.
regions: []
excluded_regions: []
regions_basis: unstated
eligibility_notes: >-
  The target URL https://www.databricks.com/startups returns 404; the live
  program page is https://www.databricks.com/product/startups. That page
  publishes the credit figure but NO eligibility criteria at all — no age,
  funding, VC-backing, employee or regional rule — and instead says "Not
  sure if you qualify? Apply or ask your investor". The stages listed here
  come from Databricks' own announcement post
  https://www.databricks.com/blog/announcing-new-databricks-startup-program
  (16 June 2026), which describes "Early-stage, venture-backed startups"
  that "recently raised institutional funding (pre-seed through Series A)".
  Because that wording is on the blog and not on the program page,
  requires_vc_backing and funding_required are left unknown rather than set
  true. Credit duration and any expiry are published nowhere I could find.
  The apply button points to a Google Sites form
  (sites.google.com/databricks.com/startup-program-apply) carrying itm_
  tracking parameters, so apply_url is set to the clean program page
  instead. Independently re-audited: a second reviewer opened the vendor
  page and checked the quote, amount and source.

# Application
application_mechanism: self-serve-form
requires_sales_call: false

# Status
