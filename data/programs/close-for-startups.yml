eligibility_notes: 'The program is described only from the partner side: Close is recruiting
  accelerators/incubators to carry the deal, so a founder reaches it through their own accelerator''s
  perks marketplace rather than by applying to Close directly. What I could NOT inspect: the
  actual discount percentage, duration, and any startup eligibility criteria are not published
  on any Close page — the partner page states the deal exists but names no figure. Separately,
  https://close.com/crm-for-startups is purely marketing and contains no startup discount;
  it offers only the standard "Try Close free for 14 days. No credit card required" trial
  available to everyone. Close also runs an unrelated Visa Small Business offer (20% off the
  first month) which is not a startup program. accelerator_required is left unknown because
  the page states the distribution channel without stating it is the only route. Imported
  from a verification sweep whose quote fidelity later failed audit in 13 of 22 sampled records.
  This entry was NOT independently re-audited, so the evidence quote may be a close paraphrase
  rather than the vendor''s exact wording. Re-read the source before relying on precise phrasing.
  Re-confirmed verbatim 2026-09-16. This is a partner-marketplace route only: no discount
  percentage, credit amount or direct eligibility rule is published.'
