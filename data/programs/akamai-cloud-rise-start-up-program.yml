eligibility_notes: >-
  Age cap quoted as "established businesses fewer than seven years old".
  Exclusion quoted as "Sorry, existing customers are not eligible for
  Rise." Account requirement quoted as "You must create a new account for
  your start-up with 1) the corporate email address associated with your
  company domain, and 2) a valid credit card." The page lists traction
  signals (paid employees outside founders, non-friends-and-family users,
  initial revenue, or VC funding) as qualifying signals, so VC funding is
  not stated as mandatory; funding_required left unknown. The intake form
  is embedded on the same URL, so no separate apply URL exists. A discovery
  call is described as a process step but is not stated as a requirement,
  so requires_sales_call is left unknown. Independently re-audited: a
  second reviewer opened the vendor page and checked the quote, amount and
  source.

