official_source: "https://www.scaleway.com/en/startup-program/"

# Benefit
benefit_type: credit
benefit_summary: >-
  Three stage-based cloud credit tiers: up to EUR 1,000 over one year
  (Founders), EUR 9,000 over six months (Early Stage), and EUR 36,000 over
  twelve months (Growth Stage).
amount_is_published: true
amount_max: 36000
currency: EUR
duration_months: 12
expiry_note: >-
  Page states the credit window runs 6 or 12 months after credits
  activation, depending on stage.
excludes: [Existing Scaleway clients]
tiers:
  - name: Founders Program
    amount_max: 1000
    quote: up to €1,000 cloud credits to use over one year on our multi-cloud products
    partner_gate: unknown
    notes: 12-month credit window.
  - name: Early Stage Program
    amount_max: 9000
    quote: 1 500€ per month for 6 month, for a total of 9,000€ in cloud credits
    partner_gate: unknown
    notes: Monthly allocation over 6 months.
  - name: Growth Stage Program
    amount_max: 36000
    quote: 3000€ per month for 12 month, for a total of 36,000€ in cloud credits
    partner_gate: unknown
    notes: Monthly allocation over 12 months.
stages: [idea, pre-seed, seed, series-a]
company_age_max_years: 5
employees_max: 50
new_customer_only: true

# Geography. See docs/verification-policy.md for what 'asserted' requires.
