eligibility_notes: >-
  Core criteria quoted verbatim as "Less than 5 years old I Less than 50
  employees I Not yet a Scaleway client". Could not inspect: the
  application form URL and mechanism (the page surfaces only the contact
  address startup-program@scaleway.com), the per-tier eligibility gates
  (the page does not say what distinguishes Founders from Early Stage from
  Growth Stage), and any funding criteria. Prior hint of "region-limited"
  is NOT supported: the only geographic language is marketing copy
  ("especially when tackling the EU market"), which states no eligibility
  restriction, so regions_basis is unstated. Independently re-audited: a
  second reviewer opened the vendor page and checked the quote, amount and
  source.
approval_time: Page states the admission committee reviews applications each week.

