eligibility_notes: 'NOT INSPECTABLE: GitLab''s public-facing program page and application
  form could not be read — https://about.gitlab.com/solutions/startups and https://about.gitlab.com/solutions/startups/join/
  both return 403 to automated fetching, and every handbook.gitlab.com path 302-redirects
  to a projects.gitlab.io auth endpoint. The record is therefore built on the handbook source
  markdown served from GitLab''s own gitlab.com repository, read at a pinned commit; the live
  page may differ. Funding caps are ceilings: Seed "up to $5 million in funding", Series A/B
  "up to $20 million in funding", both requiring externally raised capital, and both "New
  customers only." Support is excluded in year one for both tiers. Separately, https://docs.gitlab.com/subscriptions/community_programs/
  states the program "provides GitLab Ultimate, plus 50,000 compute minutes per month for
  12 months" without restating the tier split. apply_url is the address named in the handbook
  and was NOT independently confirmed to resolve. Imported from a verification sweep whose
  quote fidelity later failed audit in 13 of 22 sampled records. This entry was NOT independently
  re-audited, so the evidence quote may be a close paraphrase rather than the vendor''s exact
  wording. Re-read the source before relying on precise phrasing. Re-confirmed 2026-09-16
  on about.gitlab.com. Two tiers are published: Seed stage gets a "Free Ultimate license for
  a year (SaaS or self-managed) up to 20 seats" with up to $5M raised; Early stage gets "50%
  discount on any tier; up to 20 Users" for Series A/B with up to $20M raised. All offers
  are "New customers only".'
