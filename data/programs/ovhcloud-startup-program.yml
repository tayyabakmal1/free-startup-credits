benefit_summary: >-
  Two levels of free OVHcloud credits: EUR 10,000 with 6 hours of engineer
  time at Start level, and up to EUR 100,000 with up to 20 hours of
  engineer time at Scale level, for a maximum of 12 months.
amount_is_published: true
amount_max: 100000
