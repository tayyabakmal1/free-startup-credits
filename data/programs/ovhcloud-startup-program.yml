    quote: €10,000 of free cloud credits
    amount_max: 10000
    partner_gate: none
    notes: "Also listed with \"6 hours of 1-on-1 time with an engineer (free)\"."
  - name: Scale (scaleups)
    quote: Up to €100,000 of free cloud credits
    amount_max: 100000
    partner_gate: none
    notes: >-
      Also listed with "Up to 20 hours of 1-on-1 time with an engineer". FAQ
      associates this level with Series-A and beyond funded startups.
partner_gate: none

